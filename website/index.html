<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Primal Legion Forever</title>
  <meta name="description" content="Primal Legion Forever – World of Warcraft Forever guild">
  <meta name="theme-color" content="#00102d">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preload" as="image" type="image/webp"
        imagesrcset="images/bg-1280.webp 1280w, images/bg-1920.webp 1920w, images/bg-2560.webp 2560w, images/bg-3840.webp 3840w"
        imagesizes="100vw" media="(orientation: landscape)">
  <style>
    /* Color scheme derived from the guild logo (gold/cream/brown) and guild symbol (royal blue/navy) */
    :root {
      --gold-light: #fae5a0;
      --gold:       #f0c972;
      --gold-mid:   #c69547;
      --gold-dark:  #9e6926;
      --bronze:     #764a15;
      --cream:      #fdf7cd;
      --brown-dark: #1a0900;
      --royal-blue: #002355;
      --navy:       #011a41;
      --navy-deep:  #00102d;

      /* Sizes of the crest (logo + symbols) */
      --logo-w: min(56vw, 900px, 72svh);
      --symbol-w: calc(var(--logo-w) * 0.3);
      --crest-gap: clamp(1rem, 3vw, 3.5rem);
    }

    *, *::before, *::after { box-sizing: border-box; }

    html {
      background: var(--navy-deep); /* shown while the background image loads */
    }
    body {
      margin: 0;
      min-height: 100%;
      color: var(--cream);
      font-family: Georgia, "Times New Roman", serif;
    }

    /* Full-viewport background image */
    .background {
      position: fixed;
      inset: 0;
      z-index: -1;
    }
    .background img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: 29% 50%; /* keep dwarf & bear in view when cropped */
      display: block;
    }

    main {
      position: relative;
      min-height: 100svh;
    }

    /* Crest: centered horizontally, vertically centered in the top third */
    .crest {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 33.333svh;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: var(--crest-gap);
      padding: 0 1rem;
    }
    .crest img {
      display: block;
      width: 100%;
      height: auto;
      /* Medium dark glow following the image outline (alpha channel) */
      filter:
        drop-shadow(0 0 4px rgb(26 9 0 / 0.9))
        drop-shadow(0 0 14px rgb(26 9 0 / 0.65));
    }
    .crest-center { position: relative; width: var(--logo-w); flex: 0 0 auto; }
    .crest .logo { margin: 0; }
    .crest .symbol { width: var(--symbol-w); flex: 0 0 auto; }

    /* Countdown + Discord link, hanging below the logo
       (absolute, so the logo keeps its position in the top third) */
    .below-logo {
      --below-gap: clamp(1rem, 3vw, 2.5rem);
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      font-size: clamp(1.4rem, 2.6vw, 2.6rem);
    }

    /* Countdown to the WoW Forever release */
    .countdown {
      position: relative; /* anchor for the tooltip */
      margin-top: var(--below-gap);
      padding: 0.2em 0.4em 0.4em 0; /* top right bottom left */
      display: flex;
      gap: 0.9em;
      background: rgb(255 255 255 / 0.8);
      border-radius: 0.25em;
      color: var(--gold-dark);
      white-space: nowrap;
      cursor: default;
    }
    .countdown[hidden] { display: none; }
    .countdown .unit { display: flex; flex-direction: column; align-items: center; min-width: 2.2em; }
    .countdown .value { font-weight: bold; line-height: 1.1; font-variant-numeric: tabular-nums; }
    .countdown .label {
      font-size: max(0.38em, 0.7rem);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--bronze);
    }

    /* Discord link (SVG recolored to --gold-dark by tools/build_images.py) */
    .discord {
      position: relative; /* anchor for the tooltip */
      display: block;
      margin-top: var(--below-gap);
    }
    .discord img {
      display: block;
      width: 5.4em; /* relative to the countdown font size */
      height: auto;
      filter: none; /* no glow (overrides .crest img) */
      transition: transform 0.15s ease;
    }
    .discord:hover img,
    .discord:focus-visible img { transform: scale(1.06); }

    /* Tooltips: navy + gold border (shield colors), cream text, small arrow.
       Placement: countdown = left (wide screens) / top (narrow), Discord = below. */
    .tooltip {
      --arrow: 8px;
      position: absolute;
      z-index: 10;
      padding: 0.45em 0.9em;
      background: rgb(0 16 45 / 0.9); /* --navy-deep 90% */
      border: 1px solid var(--gold-mid);
      border-radius: 0.25rem;
      box-shadow: 0 2px 10px rgb(0 0 0 / 0.45);
      color: var(--cream);
      font-size: 0.95rem;
      font-weight: normal;
      letter-spacing: 0.03em;
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.15s ease, translate 0.15s ease, visibility 0.15s;
    }
    /* Arrow: rotated square with the gold border on the two outer sides */
    .tooltip::before {
      content: "";
      position: absolute;
      width: var(--arrow);
      height: var(--arrow);
      background: inherit;
      border: inherit;
      border-width: 0;
    }

    /* Below (Discord) */
    .tooltip-bottom {
      top: calc(100% + 10px);
      left: 50%;
      transform: translateX(-50%);
      translate: 0 6px; /* slide up toward the element */
    }
    .tooltip-bottom::before {
      bottom: 100%;
      left: 50%;
      transform: translate(-50%, 50%) rotate(45deg);
      border-top-width: 1px;
      border-left-width: 1px;
    }

    /* Left (countdown on wide screens) */
    .tooltip-side {
      right: calc(100% + 12px);
      top: 50%;
      transform: translateY(-50%);
      translate: -6px 0; /* slide right toward the element */
    }
    .tooltip-side::before {
      left: 100%;
      top: 50%;
      transform: translate(-50%, -50%) rotate(45deg);
      border-top-width: 1px;
      border-right-width: 1px;
    }

    /* Top (countdown on narrow screens) */
    @media (max-width: 900px) {
      .tooltip-side {
        right: auto;
        top: auto;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        translate: 0 -6px; /* slide down toward the element */
      }
      .tooltip-side::before {
        left: 50%;
        top: 100%;
        transform: translate(-50%, -50%) rotate(45deg);
        border-top-width: 0;
        border-right-width: 1px;
        border-bottom-width: 1px;
      }
    }

    /* Show: hover (mouse), keyboard focus, or tap on touch devices (.show-tip, set by script) */
    @media (hover: hover) {
      .countdown:hover .tooltip,
      .discord:hover .tooltip { opacity: 1; visibility: visible; translate: 0 0; }
    }
    .countdown:focus-visible .tooltip,
    .discord:focus-visible .tooltip,
    .countdown.show-tip .tooltip { opacity: 1; visibility: visible; translate: 0 0; }

    @media (prefers-reduced-motion: reduce) {
      .tooltip { transition: none; }
    }

    /* Phones / narrow screens: one symbol above the logo */
    @media (max-width: 700px) {
      :root {
        --logo-w: min(90vw, 560px);
        --symbol-w: min(26vw, 160px);
        --crest-gap: 0.5rem;
      }
      .crest {
        flex-direction: column;
        height: auto;
        min-height: 33.333svh;
        padding-top: 1.5rem;
      }
      .crest .symbol-right { display: none; }
    }
  </style>
</head>
<body>
  <picture class="background">
    <source type="image/webp" media="(orientation: portrait)"
            srcset="images/bg-portrait-450.webp 450w, images/bg-portrait-900.webp 900w"
            sizes="56.25vh">
    <source media="(orientation: portrait)"
            srcset="images/bg-portrait-450.jpg 450w, images/bg-portrait-900.jpg 900w"
            sizes="56.25vh">
    <source type="image/webp"
            srcset="images/bg-1280.webp 1280w, images/bg-1920.webp 1920w, images/bg-2560.webp 2560w, images/bg-3840.webp 3840w"
            sizes="100vw">
    <img src="images/bg-1920.jpg"
         srcset="images/bg-1280.jpg 1280w, images/bg-1920.jpg 1920w, images/bg-2560.jpg 2560w, images/bg-3840.jpg 3840w"
         sizes="100vw" alt="" fetchpriority="high">
  </picture>

  <main>
    <header class="crest">
      <picture class="symbol symbol-left">
        <source type="image/webp" srcset="images/symbol-256.webp 256w, images/symbol-512.webp 512w" sizes="(max-width: 700px) 26vw, 17vw">
        <img src="images/symbol-512.png" srcset="images/symbol-256.png 256w, images/symbol-512.png 512w"
             sizes="(max-width: 700px) 26vw, 17vw" alt="Primal Legion guild symbol" width="512" height="512">
      </picture>

      <div class="crest-center">
        <h1 class="logo">
          <picture>
            <source type="image/webp" srcset="images/logo-800.webp 800w, images/logo-1600.webp 1600w" sizes="(max-width: 700px) 90vw, 56vw">
            <img src="images/logo-1600.png" srcset="images/logo-800.png 800w, images/logo-1600.png 1600w"
                 sizes="(max-width: 700px) 90vw, 56vw" alt="Primal Legion Forever" width="1600" height="533">
          </picture>
        </h1>

        <div class="below-logo">
          <!-- Shown by the script below; stays hidden without JavaScript or after release -->
          <div class="countdown" id="countdown" lang="de" tabindex="0" role="timer" aria-describedby="countdown-tip" hidden>
            <span class="tooltip tooltip-side" id="countdown-tip" role="tooltip">Primal Legion Forever in ...</span>
            <div class="unit"><span class="value" data-part="days">0</span><span class="label" data-label="days">Tage</span></div>
            <div class="unit"><span class="value" data-part="hours">00</span><span class="label" data-label="hours">Stunden</span></div>
            <div class="unit"><span class="value" data-part="minutes">00</span><span class="label" data-label="minutes">Minuten</span></div>
            <div class="unit"><span class="value" data-part="seconds">00</span><span class="label" data-label="seconds">Sekunden</span></div>
          </div>

          <a class="discord" href="https://discord.gg/gnGRPBTTb" target="_blank" rel="noopener noreferrer"
             aria-describedby="discord-tip">
            <img src="images/discord.svg" alt="Primal Legion Discord Server" width="191" height="28">
            <span class="tooltip tooltip-bottom" id="discord-tip" role="tooltip">Primal Legion Discord Server</span>
          </a>
        </div>
      </div>

      <picture class="symbol symbol-right" aria-hidden="true">
        <source type="image/webp" srcset="images/symbol-256.webp 256w, images/symbol-512.webp 512w" sizes="17vw">
        <img src="images/symbol-512.png" srcset="images/symbol-256.png 256w, images/symbol-512.png 512w"
             sizes="17vw" alt="" width="512" height="512">
      </picture>
    </header>
  </main>

  <script>
    // Countdown to the WoW Forever release: 4 Nov 2026, 15:00 PST (UTC-8) = 23:00 UTC.
    // Date math in UTC milliseconds, so it is correct in every user time zone.
    (function () {
      const RELEASE = Date.UTC(2026, 10, 4, 23, 0, 0); // month is 0-based: 10 = November
      const LABELS = {
        days:    ["Tag", "Tage"],
        hours:   ["Stunde", "Stunden"],
        minutes: ["Minute", "Minuten"],
        seconds: ["Sekunde", "Sekunden"]
      };

      const box = document.getElementById("countdown");
      const parts = {}, labels = {};
      for (const key in LABELS) {
        parts[key] = box.querySelector('[data-part="' + key + '"]');
        labels[key] = box.querySelector('[data-label="' + key + '"]');
      }

      let timer;
      function tick() {
        const remaining = Math.floor((RELEASE - Date.now()) / 1000);
        if (remaining <= 0) {
          box.hidden = true;
          clearInterval(timer);
          return;
        }
        const values = {
          days:    Math.floor(remaining / 86400),
          hours:   Math.floor(remaining / 3600) % 24,
          minutes: Math.floor(remaining / 60) % 60,
          seconds: remaining % 60
        };
        for (const key in values) {
          const v = values[key];
          parts[key].textContent = key === "days" ? v : String(v).padStart(2, "0");
          labels[key].textContent = LABELS[key][v === 1 ? 0 : 1];
        }
        box.hidden = false;
      }

      tick();
      if (!box.hidden) timer = setInterval(tick, 1000);

      // Touch devices (no hover): tap the countdown to toggle its tooltip, tap elsewhere to close
      if (window.matchMedia("(hover: none)").matches) {
        box.addEventListener("click", function (e) {
          e.stopPropagation();
          box.classList.toggle("show-tip");
        });
        document.addEventListener("click", function () {
          box.classList.remove("show-tip");
        });
      }
    })();
  </script>
</body>
</html>
